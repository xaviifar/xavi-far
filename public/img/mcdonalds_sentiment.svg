<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="mcdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141311"/>
      <stop offset="100%" stop-color="#0a0907"/>
    </linearGradient>
    <linearGradient id="mcdGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6F00" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="gridMcd" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#mcdBg)"/>
  <rect width="800" height="500" fill="url(#gridMcd)"/>

  <!-- Top Ambient Glow -->
  <rect x="160" y="20" width="480" height="130" rx="65" fill="url(#mcdGlow)" filter="blur(40px)"/>

  <!-- Main Frame Container -->
  <rect x="65" y="45" width="670" height="410" rx="14" fill="#11100e" stroke="#2c261e" stroke-width="1.5"/>

  <!-- Header Bar -->
  <rect x="65" y="45" width="670" height="46" rx="14" fill="#1a1815"/>
  <rect x="65" y="77" width="670" height="14" fill="#1a1815"/>
  <line x1="65" y1="91" x2="735" y2="91" stroke="#2c261e" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="93" cy="68" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="111" cy="68" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="129" cy="68" r="5" fill="#10B981" opacity="0.8"/>

  <!-- Window Title -->
  <text x="400" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8A8A8A" text-anchor="middle">mcdonalds-sentiment · nlp-neural-net.py</text>

  <!-- Status Pill -->
  <rect x="625" y="59" width="95" height="20" rx="10" fill="#FF6F00" fill-opacity="0.15" stroke="#FF6F00" stroke-opacity="0.3"/>
  <circle cx="637" cy="69" r="3" fill="#FF6F00"/>
  <text x="646" y="73" font-family="ui-monospace, monospace" font-size="10" fill="#fb923c" font-weight="600">TENSORFLOW</text>

  <!-- Left Side: ROC Curve & Model Comparison Plot -->
  <g transform="translate(85, 110)">
    <rect width="275" height="320" rx="8" fill="#161411" stroke="#2c261e" stroke-width="1"/>
    <text x="16" y="26" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#fb923c">ROC CURVE EVALUATION</text>

    <!-- Plot Chart Container -->
    <rect x="14" y="40" width="247" height="185" rx="6" fill="#0d0c0a" stroke="#2c261e" stroke-width="1"/>

    <!-- Grid lines inside plot -->
    <line x1="45" y1="55" x2="245" y2="55" stroke="#26231c" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="45" y1="95" x2="245" y2="95" stroke="#26231c" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="45" y1="135" x2="245" y2="135" stroke="#26231c" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="45" y1="175" x2="245" y2="175" stroke="#26231c" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Axes -->
    <line x1="45" y1="50" x2="45" y2="185" stroke="#4b4437" stroke-width="1.5"/>
    <line x1="45" y1="185" x2="250" y2="185" stroke="#4b4437" stroke-width="1.5"/>
    <text x="40" y="58" font-family="ui-monospace, monospace" font-size="8" fill="#78716c" text-anchor="end">1.0</text>
    <text x="40" y="118" font-family="ui-monospace, monospace" font-size="8" fill="#78716c" text-anchor="end">0.5</text>
    <text x="40" y="185" font-family="ui-monospace, monospace" font-size="8" fill="#78716c" text-anchor="end">0.0</text>

    <!-- Diagonal baseline -->
    <line x1="45" y1="185" x2="245" y2="55" stroke="#44403c" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Curve 1: Neural Network (AUC: 0.92) -->
    <path d="M 45 185 Q 55 70, 245 55" fill="none" stroke="#FF6F00" stroke-width="2.5"/>

    <!-- Curve 2: Logistic Regression (AUC: 0.81) -->
    <path d="M 45 185 Q 85 110, 245 55" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-dasharray="4 2"/>

    <!-- Legend -->
    <g transform="translate(18, 235)">
      <circle cx="6" cy="6" r="4" fill="#FF6F00"/>
      <text x="16" y="9" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#f3f4f6">Neural Network (AUC = 0.92)</text>
    </g>
    <g transform="translate(18, 255)">
      <circle cx="6" cy="6" r="4" fill="#3b82f6"/>
      <text x="16" y="9" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#9ca3af">Logistic Reg. (AUC = 0.81)</text>
    </g>

    <!-- Bottom summary -->
    <rect x="14" y="274" width="247" height="32" rx="6" fill="#1c1914"/>
    <text x="137" y="294" font-family="ui-monospace, monospace" font-size="10" fill="#facc15" text-anchor="middle">Deep Learning outperforms baseline +11%</text>
  </g>

  <!-- Right Side: Classification Stream -->
  <g transform="translate(380, 110)">
    <rect width="335" height="320" rx="8" fill="#0d0c0a" stroke="#2c261e" stroke-width="1"/>
    <text x="18" y="26" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#facc15">INFERENCE ENGINE</text>

    <!-- Review Input -->
    <rect x="18" y="42" width="299" height="54" rx="6" fill="#181612" stroke="#2c261e" stroke-width="1"/>
    <text x="28" y="60" font-family="-apple-system, sans-serif" font-size="10" fill="#a8a29e">CUSTOMER REVIEW (BARCELONA BRANCH):</text>
    <text x="28" y="78" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" fill="#f3f4f6">&quot;Servicio súper rápido, las patatas calientes y limpio.&quot;</text>

    <!-- Pipeline steps -->
    <text x="18" y="118" font-family="ui-monospace, monospace" font-size="10" fill="#78716c">[1] Tokenize &amp; Stopword Removal: 8 tokens</text>
    <text x="18" y="136" font-family="ui-monospace, monospace" font-size="10" fill="#78716c">[2] Lemmatization via NLTK/SpaCy</text>
    <text x="18" y="154" font-family="ui-monospace, monospace" font-size="10" fill="#fb923c">⚡ [3] TF-IDF Sparse Embedding (2,500 features)</text>
    <text x="18" y="172" font-family="ui-monospace, monospace" font-size="10" fill="#facc15">[4] Deep Dense Feedforward Net inference</text>

    <!-- Prediction badge -->
    <rect x="18" y="190" width="299" height="48" rx="6" fill="#16a34a" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.3"/>
    <text x="32" y="210" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#4ade80">PREDICTION: POSITIVE (96.4%)</text>
    <text x="32" y="226" font-family="-apple-system, sans-serif" font-size="9.5" fill="#a7f3d0">Probabilities: Pos 0.964 · Neu 0.024 · Neg 0.012</text>

    <!-- Performance Card -->
    <rect x="18" y="252" width="299" height="52" rx="6" fill="#181612" stroke="#2c261e" stroke-width="1"/>
    <g transform="translate(30, 268)">
      <text x="0" y="12" font-family="ui-monospace, monospace" font-size="9" fill="#9ca3af">ACCURACY</text>
      <text x="0" y="26" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#f3f4f6">89.4%</text>
    </g>
    <g transform="translate(130, 268)">
      <text x="0" y="12" font-family="ui-monospace, monospace" font-size="9" fill="#9ca3af">F1-SCORE</text>
      <text x="0" y="26" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#fb923c">0.892</text>
    </g>
    <g transform="translate(230, 268)">
      <text x="0" y="12" font-family="ui-monospace, monospace" font-size="9" fill="#9ca3af">REVIEWS</text>
      <text x="0" y="26" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#34d399">3,400+</text>
    </g>
  </g>
</svg>
