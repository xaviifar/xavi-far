<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="agentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111317"/>
      <stop offset="100%" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="agentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="gridAgents" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#agentBg)"/>
  <rect width="800" height="500" fill="url(#gridAgents)"/>

  <!-- Top Ambient Glow -->
  <rect x="160" y="20" width="480" height="130" rx="65" fill="url(#agentGlow)" filter="blur(40px)"/>

  <!-- Main Frame Container -->
  <rect x="65" y="45" width="670" height="410" rx="14" fill="#0f1115" stroke="#22252c" stroke-width="1.5"/>

  <!-- Header Bar -->
  <rect x="65" y="45" width="670" height="46" rx="14" fill="#15181e"/>
  <rect x="65" y="77" width="670" height="14" fill="#15181e"/>
  <line x1="65" y1="91" x2="735" y2="91" stroke="#22252c" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="93" cy="68" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="111" cy="68" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="129" cy="68" r="5" fill="#10B981" opacity="0.8"/>

  <!-- Window Title -->
  <text x="400" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#8A8A8A" text-anchor="middle">agent-orchestrator · multi-agent-cluster.py</text>

  <!-- Status Pill -->
  <rect x="635" y="59" width="85" height="20" rx="10" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-opacity="0.3"/>
  <circle cx="647" cy="69" r="3" fill="#3b82f6"/>
  <text x="656" y="73" font-family="ui-monospace, monospace" font-size="10" fill="#60a5fa" font-weight="600">ORCHESTRATING</text>

  <!-- Left Side: Agent Orchestration Flow -->
  <g transform="translate(85, 110)">
    <rect width="275" height="320" rx="8" fill="#13151b" stroke="#22252c" stroke-width="1"/>
    <text x="16" y="26" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#60a5fa">AGENT TOPOLOGY GRAPH</text>

    <!-- Master Orchestrator Node -->
    <rect x="14" y="42" width="247" height="48" rx="6" fill="#1a1d24" stroke="#3b82f6" stroke-width="1.2"/>
    <circle cx="34" cy="66" r="10" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="34" y="70" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#93c5fd" text-anchor="middle">👑</text>
    <text x="54" y="60" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#f3f4f6">Master Orchestrator</text>
    <text x="54" y="75" font-family="-apple-system, sans-serif" font-size="9.5" fill="#9ca3af">Deterministic state loop &amp; triage</text>

    <!-- Connecting lines -->
    <path d="M 137 90 L 137 105" stroke="#374151" stroke-width="1.5"/>

    <!-- Worker 1: Tool Executor -->
    <rect x="14" y="105" width="247" height="46" rx="6" fill="#181a20" stroke="#22252c" stroke-width="1"/>
    <circle cx="34" cy="128" r="9" fill="#10b981" fill-opacity="0.2"/>
    <text x="54" y="122" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#f3f4f6">Executor Agent (Docker Sandbox)</text>
    <text x="54" y="137" font-family="-apple-system, sans-serif" font-size="9.5" fill="#10b981">✓ Deterministic tool execution</text>

    <!-- Worker 2: Semantic Memory -->
    <rect x="14" y="160" width="247" height="46" rx="6" fill="#181a20" stroke="#22252c" stroke-width="1"/>
    <circle cx="34" cy="183" r="9" fill="#8b5cf6" fill-opacity="0.2"/>
    <text x="54" y="177" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#f3f4f6">Vector Memory Store</text>
    <text x="54" y="192" font-family="-apple-system, sans-serif" font-size="9.5" fill="#a78bfa">Qdrant · Context window 128k</text>

    <!-- Worker 3: Redis Task Queue -->
    <rect x="14" y="215" width="247" height="46" rx="6" fill="#181a20" stroke="#22252c" stroke-width="1"/>
    <circle cx="34" cy="238" r="9" fill="#ef4444" fill-opacity="0.2"/>
    <text x="54" y="232" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#f3f4f6">Redis Message Broker</text>
    <text x="54" y="247" font-family="-apple-system, sans-serif" font-size="9.5" fill="#f87171">High throughput pub/sub queues</text>

    <!-- Bottom summary tag -->
    <rect x="14" y="272" width="247" height="34" rx="6" fill="#1a1d24"/>
    <text x="137" y="293" font-family="ui-monospace, monospace" font-size="10" fill="#38bdf8" text-anchor="middle">4 Agents Live · 0 Unhandled Exceptions</text>
  </g>

  <!-- Right Side: Real-time Execution Stream -->
  <g transform="translate(380, 110)">
    <rect width="335" height="320" rx="8" fill="#0d0e12" stroke="#22252c" stroke-width="1"/>
    <text x="18" y="26" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#10b981">EXECUTION TELEMETRY</text>

    <!-- Terminal commands -->
    <text x="18" y="54" font-family="ui-monospace, monospace" font-size="10.5" fill="#38bdf8">❯ orchestrator.dispatch(goal="Extract &amp; Verify")</text>
    <text x="18" y="76" font-family="ui-monospace, monospace" font-size="10" fill="#6b7280">[12:04:18] Initializing state graph with 3 sub-agents</text>
    <text x="18" y="98" font-family="ui-monospace, monospace" font-size="10" fill="#10b981">✓ Redis task broker ping: 1.2ms (healthy)</text>
    <text x="18" y="120" font-family="ui-monospace, monospace" font-size="10" fill="#9ca3af">[12:04:19] [Agent-Planner] Strategy: 4 parallel steps</text>
    <text x="18" y="142" font-family="ui-monospace, monospace" font-size="10" fill="#eab308">⚡ [Agent-Executor] Executing tool: fetch_dataset()</text>
    <text x="18" y="164" font-family="ui-monospace, monospace" font-size="10" fill="#a78bfa">[12:04:21] [Agent-Memory] Embedding 48 documents</text>
    <text x="18" y="186" font-family="ui-monospace, monospace" font-size="10" fill="#60a5fa">→ Vector similarity: cosine 0.941 above threshold</text>
    <text x="18" y="208" font-family="ui-monospace, monospace" font-size="10" fill="#10b981">✓ Validation pass: Deterministic loop complete</text>
    <text x="18" y="230" font-family="ui-monospace, monospace" font-size="10" fill="#9ca3af">[12:04:22] State finalized in PostgreSQL session store</text>

    <!-- Performance Stats Card -->
    <rect x="18" y="252" width="299" height="52" rx="6" fill="#15181e" stroke="#22252c" stroke-width="1"/>
    <g transform="translate(30, 268)">
      <text x="0" y="12" font-family="ui-monospace, monospace" font-size="9" fill="#9ca3af">LATENCY</text>
      <text x="0" y="26" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#f3f4f6">182ms</text>
    </g>
    <g transform="translate(130, 268)">
      <text x="0" y="12" font-family="ui-monospace, monospace" font-size="9" fill="#9ca3af">CONTAINERS</text>
      <text x="0" y="26" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#38bdf8">3 Docker</text>
    </g>
    <g transform="translate(230, 268)">
      <text x="0" y="12" font-family="ui-monospace, monospace" font-size="9" fill="#9ca3af">TOOL SUCCESS</text>
      <text x="0" y="26" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#10b981">99.8%</text>
    </g>
  </g>
</svg>
