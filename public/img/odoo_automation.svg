<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgOdoo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19131c"/>
      <stop offset="100%" stop-color="#0c090e"/>
    </linearGradient>
    <linearGradient id="glowOdoo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#714B67" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#4169E1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="gridOdoo" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgOdoo)"/>
  <rect width="800" height="500" fill="url(#gridOdoo)"/>

  <rect x="180" y="20" width="440" height="130" rx="65" fill="url(#glowOdoo)" filter="blur(40px)"/>

  <!-- Frame -->
  <rect x="70" y="50" width="660" height="400" rx="14" fill="#141117" stroke="#2a2330" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="70" y="50" width="660" height="46" rx="14" fill="#1b1720"/>
  <rect x="70" y="82" width="660" height="14" fill="#1b1720"/>
  <line x1="70" y1="96" x2="730" y2="96" stroke="#2a2330" stroke-width="1"/>

  <circle cx="98" cy="73" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="116" cy="73" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="134" cy="73" r="5" fill="#10B981" opacity="0.8"/>

  <text x="400" y="77" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#9ca3af" text-anchor="middle">enterprise-automation · odoo-sync-service</text>

  <!-- Left: ERP Modules Pipeline -->
  <g transform="translate(100, 120)">
    <rect width="250" height="305" rx="8" fill="#1a1622" stroke="#2e2638" stroke-width="1"/>
    <text x="18" y="28" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#a855f7">ERP INTEGRATION MODULES</text>

    <!-- Module 1 -->
    <rect x="14" y="44" width="222" height="52" rx="6" fill="#221d2c" stroke="#3b3149" stroke-width="1"/>
    <circle cx="32" cy="70" r="10" fill="#714B67"/>
    <text x="50" y="65" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#f3f4f6">Odoo CRM &amp; Invoicing</text>
    <text x="50" y="80" font-family="-apple-system, sans-serif" font-size="10" fill="#9ca3af">Automated fiscal synchronization</text>

    <!-- Module 2 -->
    <rect x="14" y="106" width="222" height="52" rx="6" fill="#221d2c" stroke="#3b3149" stroke-width="1"/>
    <circle cx="32" cy="132" r="10" fill="#43B02A"/>
    <text x="50" y="127" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#f3f4f6">Selenium Scraper Bots</text>
    <text x="50" y="142" font-family="-apple-system, sans-serif" font-size="10" fill="#9ca3af">Headless recurrent data extractors</text>

    <!-- Module 3 -->
    <rect x="14" y="168" width="222" height="52" rx="6" fill="#221d2c" stroke="#3b3149" stroke-width="1"/>
    <circle cx="32" cy="194" r="10" fill="#009688"/>
    <text x="50" y="189" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#f3f4f6">Flask Microservices</text>
    <text x="50" y="204" font-family="-apple-system, sans-serif" font-size="10" fill="#9ca3af">REST API endpoints &amp; webhooks</text>

    <!-- Module 4 -->
    <rect x="14" y="230" width="222" height="52" rx="6" fill="#221d2c" stroke="#3b3149" stroke-width="1"/>
    <circle cx="32" cy="256" r="10" fill="#60a5fa"/>
    <text x="50" y="251" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#f3f4f6">OpenRouter LLM Layer</text>
    <text x="50" y="266" font-family="-apple-system, sans-serif" font-size="10" fill="#9ca3af">Document &amp; ticket summarizer</text>
  </g>

  <!-- Right: Execution terminal -->
  <g transform="translate(375, 120)">
    <rect width="325" height="305" rx="8" fill="#100e14" stroke="#251f2c" stroke-width="1"/>
    <text x="18" y="28" font-family="ui-monospace, monospace" font-size="10.5" fill="#22c55e">❯ python run_worker.py --scheduler=active</text>
    <text x="18" y="52" font-family="ui-monospace, monospace" font-size="10" fill="#9ca3af">[10:42:01] Initializing Odoo ORM environment...</text>
    <text x="18" y="72" font-family="ui-monospace, monospace" font-size="10" fill="#4ade80">✓ PostgreSQL pool connected (12 workers)</text>
    <text x="18" y="96" font-family="ui-monospace, monospace" font-size="10" fill="#9ca3af">[10:42:03] Selenium headless chrome spawned</text>
    <text x="18" y="116" font-family="ui-monospace, monospace" font-size="10" fill="#9ca3af">→ Scraping portal records: 1,420 rows ingested</text>
    <text x="18" y="140" font-family="ui-monospace, monospace" font-size="10" fill="#c084fc">[10:42:07] Invoking LLM parser via OpenRouter...</text>
    <text x="18" y="160" font-family="ui-monospace, monospace" font-size="10" fill="#eab308">Model: deepseek/deepseek-chat · temp: 0.1</text>
    <text x="18" y="180" font-family="ui-monospace, monospace" font-size="10" fill="#4ade80">✓ Extracted structured invoice metadata</text>
    <text x="18" y="204" font-family="ui-monospace, monospace" font-size="10" fill="#9ca3af">[10:42:10] Syncing records to Odoo database...</text>
    <text x="18" y="224" font-family="ui-monospace, monospace" font-size="10" fill="#22c55e">✓ All 1,420 entries reconciled with 0 errors</text>

    <rect x="18" y="250" width="289" height="36" rx="6" fill="#1a1622" stroke="#3b3149" stroke-width="1"/>
    <text x="30" y="272" font-family="ui-monospace, monospace" font-size="10.5" fill="#f3f4f6">Status: Daemon healthy · Next run in 15m</text>
  </g>
</svg>
