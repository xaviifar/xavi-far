<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgParty" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18151f"/>
      <stop offset="100%" stop-color="#0c0a10"/>
    </linearGradient>
    <linearGradient id="partyGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="gridParty" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgParty)"/>
  <rect width="800" height="500" fill="url(#gridParty)"/>

  <!-- Glow -->
  <rect x="200" y="30" width="400" height="130" rx="65" fill="url(#partyGlow)" filter="blur(40px)"/>

  <!-- Mockup frame -->
  <rect x="120" y="50" width="560" height="400" rx="16" fill="#15131a" stroke="#2d2938" stroke-width="1.5"/>

  <!-- Top bar -->
  <rect x="120" y="50" width="560" height="46" rx="16" fill="#1c1924"/>
  <rect x="120" y="82" width="560" height="14" fill="#1c1924"/>
  <line x1="120" y1="96" x2="680" y2="96" stroke="#2d2938" stroke-width="1"/>

  <circle cx="148" cy="73" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="166" cy="73" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="184" cy="73" r="5" fill="#10B981" opacity="0.8"/>

  <text x="400" y="77" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#9ca3af" text-anchor="middle">4party-app · android-client</text>

  <!-- Left: Mobile phone mockup inside -->
  <g transform="translate(160, 115)">
    <rect width="180" height="310" rx="20" fill="#0c0a10" stroke="#3b354a" stroke-width="2"/>
    <!-- Phone speaker notch -->
    <rect x="65" y="8" width="50" height="4" rx="2" fill="#2d2938"/>

    <!-- App Header -->
    <rect x="12" y="22" width="156" height="32" rx="6" fill="#241f30"/>
    <text x="22" y="42" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#f3f4f6">4Party</text>
    <circle cx="150" cy="38" r="7" fill="#a855f7"/>

    <!-- Product Grid Mockup inside phone -->
    <rect x="12" y="64" width="74" height="90" rx="8" fill="#1b1724" stroke="#2d2938" stroke-width="1"/>
    <circle cx="49" cy="98" r="16" fill="#ec4899" fill-opacity="0.3"/>
    <text x="49" y="132" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#e5e7eb" text-anchor="middle">DJ Pack</text>
    <text x="49" y="144" font-family="-apple-system, sans-serif" font-size="8" fill="#a855f7" text-anchor="middle">€120.00</text>

    <rect x="94" y="64" width="74" height="90" rx="8" fill="#1b1724" stroke="#2d2938" stroke-width="1"/>
    <circle cx="131" cy="98" r="16" fill="#a855f7" fill-opacity="0.3"/>
    <text x="131" y="132" font-family="-apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#e5e7eb" text-anchor="middle">Light Rig</text>
    <text x="131" y="144" font-family="-apple-system, sans-serif" font-size="8" fill="#a855f7" text-anchor="middle">€85.00</text>

    <!-- Cart item -->
    <rect x="12" y="164" width="156" height="46" rx="8" fill="#241f30" stroke="#3b354a" stroke-width="1"/>
    <rect x="20" y="172" width="30" height="30" rx="6" fill="#ec4899" fill-opacity="0.2"/>
    <text x="58" y="186" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" fill="#f3f4f6">Sound System 2kW</text>
    <text x="58" y="199" font-family="-apple-system, sans-serif" font-size="8" fill="#9ca3af">Quantity: 1 · In cart</text>

    <!-- Checkout button -->
    <rect x="12" y="222" width="156" height="32" rx="8" fill="#9333ea"/>
    <text x="90" y="242" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">Confirm Reservation</text>
  </g>

  <!-- Right: Architecture & Tech Details -->
  <g transform="translate(370, 120)">
    <rect width="280" height="95" rx="8" fill="#1c1924" stroke="#2d2938" stroke-width="1"/>
    <text x="16" y="28" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#c084fc">Architecture &amp; Features</text>
    <text x="16" y="48" font-family="-apple-system, sans-serif" font-size="10.5" fill="#9ca3af">• Native Android UI with Kotlin &amp; XML</text>
    <text x="16" y="66" font-family="-apple-system, sans-serif" font-size="10.5" fill="#9ca3af">• Real-time cart &amp; favorites synchronized</text>
    <text x="16" y="84" font-family="-apple-system, sans-serif" font-size="10.5" fill="#9ca3af">• Backend connectivity via Python &amp; MySQL</text>

    <rect y="110" width="280" height="185" rx="8" fill="#121018" stroke="#2d2938" stroke-width="1"/>
    <text x="16" y="134" font-family="ui-monospace, monospace" font-size="10.5" fill="#a855f7">❯ query_catalog(event_type="concert")</text>
    <text x="16" y="156" font-family="ui-monospace, monospace" font-size="10" fill="#9ca3af">Connecting to MySQL database...</text>
    <text x="16" y="176" font-family="ui-monospace, monospace" font-size="10" fill="#4ade80">✓ 48 party packages indexed</text>
    <text x="16" y="198" font-family="ui-monospace, monospace" font-size="10" fill="#9ca3af">Dispatching cart updates to device...</text>
    <text x="16" y="220" font-family="ui-monospace, monospace" font-size="10" fill="#eab308">Session verified: auth_token valid</text>
    <text x="16" y="242" font-family="ui-monospace, monospace" font-size="10" fill="#c084fc">✓ Order lifecycle managed end-to-end</text>
  </g>
</svg>
