<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f0f12" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>
    <linearGradient id="stroke-accent" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E4E4E7" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>
    <filter id="glow" x="8" y="8" width="16" height="16" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with subtle inner border -->
  <rect width="32" height="32" rx="7.5" fill="url(#bg)" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" stroke="#27272A" stroke-width="1" />

  <!-- Geometric 'X' Monogram with AI Node Core -->
  <!-- Diagonal 1 (Top-Left to Bottom-Right) -->
  <path
    d="M7.5 7.5L24.5 24.5"
    stroke="url(#stroke-accent)"
    stroke-width="2.75"
    stroke-linecap="round"
  />

  <!-- Diagonal 2 Segment A (Top-Right to Center Node) -->
  <path
    d="M24.5 7.5L18.5 13.5"
    stroke="url(#stroke-accent)"
    stroke-width="2.75"
    stroke-linecap="round"
  />

  <!-- Diagonal 2 Segment B (Center Node to Bottom-Left) -->
  <path
    d="M13.5 18.5L7.5 24.5"
    stroke="url(#stroke-accent)"
    stroke-width="2.75"
    stroke-linecap="round"
  />

  <!-- Emerald Intelligence Node at the Intersection -->
  <circle cx="16" cy="16" r="2.75" fill="#10B981" filter="url(#glow)" />
  <circle cx="16" cy="16" r="1.25" fill="#FFFFFF" />
</svg>
